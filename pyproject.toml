[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuh-fim-telegram"
version = "1.0.0"
description = "Forward Wazuh File Integrity Monitoring alerts to Telegram, with an interactive bot and daily digest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wazuh-fim-telegram contributors" }]
keywords = ["wazuh", "fim", "file-integrity-monitoring", "telegram", "security", "soc", "alerts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "httpx>=0.27,<0.30",
    "python-telegram-bot>=20.7,<22.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
    "structlog>=24.1,<26.0",
    "APScheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<6.0",
    "respx>=0.21,<0.23",
    "freezegun>=1.4,<2.0",
    "ruff>=0.4,<0.8",
    "mypy>=1.10,<2.0",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/your-org/wazuh-fim-telegram"
Issues = "https://github.com/your-org/wazuh-fim-telegram/issues"

[project.scripts]
wazuh-fim-telegram = "wazuh_fim_telegram.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wazuh_fim_telegram" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line-length is enforced by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/wazuh_fim_telegram"]

[[tool.mypy.overrides]]
module = "telegram.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=wazuh_fim_telegram --cov-report=term-missing"
markers = [
    "integration: tests that hit real external services (skipped by default)",
]

[tool.coverage.run]
branch = true
source = ["src/wazuh_fim_telegram"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
