# Custom Python file integrity monitor.
# Paths may be files or directories. Relative paths are resolved from this file's directory.
# Do not monitor the project root: the log and baseline must stay outside the watched set.
agent:
  hostname: kali-vm
monitor:
  poll_interval_seconds: 15
  baseline_file: baseline.json
  log_file: fim_events.log
  paths:
    - watched
    - /etc/passwd
    - /etc/shadow
    - /etc/group
    - /etc/sudoers
    - /etc/ssh/sshd_config
severity:
  CREATED: HIGH
  MODIFIED: CRITICAL
  DELETED: CRITICAL
  RENAMED: HIGH
# The Wazuh agent on this host is the primary collector. It tails monitor.log_file.
# HTTP forwarding is optional and off until forward_url points at a receiver you control.
siem:
  forward_enabled: false
  forward_url: "http://192.168.20.10:8080/fim"
  timeout_seconds: 5
  verify_tls: true
